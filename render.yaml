services:
  - type: web
    name: plastic-free-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "chmod +x backend/build.sh && ./backend/build.sh"
    startCommand: "cd backend && gunicorn backend.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: plastic-free-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: plastic-free-db
    region: oregon
    plan: free
    databaseName: plastic_free_db
    user: plastic_free_user
